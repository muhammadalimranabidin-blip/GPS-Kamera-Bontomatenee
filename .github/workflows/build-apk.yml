name: Buat APK GPS Kamera Bontomatene

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Ambil kode aplikasi
        uses: actions/checkout@v4

      - name: Pasang Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Pasang Android 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Kompilasi APK
        run: gradle --no-daemon assembleDebug

      - name: Ganti nama APK
        run: |
          mkdir -p hasil-apk
          cp app/build/outputs/apk/debug/app-debug.apk hasil-apk/GPS-Kamera-Bontomatene.apk
          sha256sum hasil-apk/GPS-Kamera-Bontomatene.apk > hasil-apk/SHA256.txt

      - name: Simpan hasil APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Kamera-Bontomatene-APK
          path: hasil-apk/
          if-no-files-found: error
          retention-days: 30
